name: Build and Release Zira Font

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 or v0.1.0)"
        required: true
      iosevka_ref:
        description: "Iosevka source ref (tag/branch/commit) to build against"
        required: false
        default: "v34.8.0"

permissions:
  contents: write

concurrency:
  group: release-zira-font
  cancel-in-progress: true

jobs:
  check:
    name: Check build plan changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      npm: ${{ steps.version.outputs.npm }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          case "$VERSION" in
            v*) TAG="$VERSION"; NPM="${VERSION#v}" ;;
            *) TAG="v$VERSION"; NPM="$VERSION" ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver, e.g. 0.1.0)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM" >> "$GITHUB_OUTPUT"

      - name: Check private-build-plans.toml changes since last release
        id: check
        run: |
          # Manual dispatch is an explicit "build now" action: always build.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "::notice::Manual dispatch: building regardless of plan changes."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | awk -v cur="$TAG" '$0 != cur' | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$PREV_TAG"..HEAD -- private-build-plans.toml; then
            echo "::notice::private-build-plans.toml unchanged since $PREV_TAG; skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::private-build-plans.toml changed since $PREV_TAG; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and release
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone Iosevka source
        run: |
          git clone --depth 1 --branch "${{ inputs.iosevka_ref || 'v34.8.0' }}" \
            https://github.com/be5invis/Iosevka.git iosevka

      - name: Copy build plans into Iosevka source
        run: cp private-build-plans.toml iosevka/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iosevka/package-lock.json

      - name: Install ttfautohint and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttfautohint zip

      - name: Install npm dependencies
        working-directory: iosevka
        run: npm install

      - name: Build fonts
        working-directory: iosevka
        run: |
          plans=$(python3 - <<'PY'
          import re
          plans = []
          with open("../private-build-plans.toml", encoding="utf-8") as f:
              for line in f:
                  m = re.match(r"\s*\[buildPlans\.([^.\]]+)\]", line)
                  if m:
                      plans.append(m.group(1))
          print(" ".join(plans))
          PY
          )
          if [ -z "$plans" ]; then
            echo "::error::No [buildPlans.*] sections found in private-build-plans.toml"
            exit 1
          fi
          echo "Build plans: $plans"
          for plan in $plans; do
            npm run build -- "contents::$plan" --jCmd=2
          done

      - name: Stage fonts into zira/ (not committed)
        run: |
          rm -rf zira
          for grp in iosevka/dist/*; do
            name=$(basename "$grp")
            sub=$(printf '%s' "$name" | sed -E 's/^Zira//; s/.*/\L&/')
            mkdir -p "zira/$sub/TTF" "zira/$sub/WOFF2"
            cp "$grp"/TTF/*.ttf "zira/$sub/TTF/"
            cp "$grp"/WOFF2/*.woff2 "zira/$sub/WOFF2/"
            # Migrate the webfont CSS generated by the build alongside the fonts,
            # stripping the " Web" suffix Iosevka appends to the family name
            cp "$grp/$name.css" "zira/$sub/$name.css"
            sed -i "s/font-family: '\([^']*\) Web';/font-family: '\1';/" "zira/$sub/$name.css"
          done
          # Ship the SIL OFL 1.1 license alongside the built fonts (OFL condition 2)
          cp LICENSE.md zira/LICENSE.md

      - name: Merge webfont CSS
        run: python3 tools/merge-webfont-css.py

      - name: List built fonts
        run: find zira -type f | sort

      - name: Package release zips
        run: |
          cd zira
          zip -r /tmp/zira-ttf.zip */TTF LICENSE.md
          # include the per-family CSS (mono/ZiraMono.css etc.) plus fonts.css
          zip -r /tmp/zira-woff2.zip */WOFF2 */*.css *.css LICENSE.md
          cd ..
          ls -lh /tmp/zira-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          files: |
            /tmp/zira-ttf.zip
            /tmp/zira-woff2.zip
          overwrite: true
          generate_release_notes: true
